name: release

# Builds the TaskFused binaries, checks each one on the kind of machine it is
# for, and publishes them with a release.
#
# Releases go out on their own. When the test workflow passes on a push to
# main and the Version in taskfused.go has no tag yet, this workflow builds
# the binaries from that commit, runs scripts/smoke.py on them, then tags the
# commit vX.Y.Z and publishes the release "TaskFused vX.Y.Z" with the archives
# and SHA256SUMS attached. Nothing goes public unless every build and check
# passes. scripts/release-plan.py has the rules, and RELEASING.md the whole
# procedure.
#
# It also attaches binaries to a release someone publishes by hand, and it
# can be run by hand to rebuild the binaries of an existing tag.

on:
  workflow_run:
    workflows: [test]
    types: [completed]
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build again, such as v0.1.0"
        required: true

permissions:
  contents: read

env:
  GO_VERSION: "1.26.x"

jobs:
  plan:
    # After the tests, only for a push to main in this repository that passed.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      ref: ${{ steps.plan.outputs.ref }}
      new: ${{ steps.plan.outputs.new }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          RUN_WORKFLOW: ${{ github.event.workflow_run.name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ ! -f scripts/release-plan.py ]; then
            echo "::notice title=Release plan::$(git rev-parse --short HEAD) predates scripts/release-plan.py, so this run releases nothing"
            exit 0
          fi
          python3 scripts/release-plan.py

  # Static binaries (musl), built and smoke-tested on their own architecture.
  linux:
    needs: plan
    if: needs.plan.outputs.tag != ''
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - name: Build static binaries
        env:
          CC: musl-gcc
          CGO_ENABLED: "1"
        run: |
          mkdir pkg
          for p in cmd/taskfused:taskfused examples/worker:taskfused-worker examples/demo:taskfused-demo; do
            go build -trimpath -tags 'sqlite_omit_load_extension netgo osusergo' \
              -ldflags '-s -w -linkmode external -extldflags "-static"' -o "pkg/${p#*:}" "./${p%:*}"
          done
          file pkg/*
          file pkg/taskfused | grep -q 'statically linked'
      - run: python3 scripts/smoke.py pkg
      - name: Package
        run: |
          cp LICENSE NOTICE THIRD_PARTY_LICENSES.md README.md pkg/
          tar -czf taskfused_linux_${{ matrix.arch }}.tar.gz -C pkg .
      - uses: actions/upload-artifact@v7
        with:
          name: taskfused_linux_${{ matrix.arch }}
          path: taskfused_linux_${{ matrix.arch }}.tar.gz

  # Apple silicon is smoke-tested on the runner; the Intel build can only be
  # checked for its architecture there.
  macos:
    needs: plan
    if: needs.plan.outputs.tag != ''
    strategy:
      matrix:
        include:
          - arch: arm64
            clang: arm64
          - arch: amd64
            clang: x86_64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build
        env:
          CGO_ENABLED: "1"
          GOARCH: ${{ matrix.arch }}
          CC: clang -arch ${{ matrix.clang }}
        run: |
          mkdir pkg
          for p in cmd/taskfused:taskfused examples/worker:taskfused-worker examples/demo:taskfused-demo; do
            go build -trimpath -tags sqlite_omit_load_extension -ldflags '-s -w' -o "pkg/${p#*:}" "./${p%:*}"
          done
          file pkg/*
          file pkg/taskfused | grep -q '${{ matrix.clang }}'
      - if: matrix.arch == 'arm64'
        run: python3 scripts/smoke.py pkg
      - name: Package
        run: |
          cp LICENSE NOTICE THIRD_PARTY_LICENSES.md README.md pkg/
          tar -czf taskfused_darwin_${{ matrix.arch }}.tar.gz -C pkg .
      - uses: actions/upload-artifact@v7
        with:
          name: taskfused_darwin_${{ matrix.arch }}
          path: taskfused_darwin_${{ matrix.arch }}.tar.gz

  # Built on Linux with mingw, then checked on a Windows runner below.
  windows:
    needs: plan
    if: needs.plan.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-mingw-w64-x86-64 zip
      - name: Build
        env:
          CC: x86_64-w64-mingw32-gcc
          CGO_ENABLED: "1"
          GOOS: windows
          GOARCH: amd64
        run: |
          mkdir pkg
          for p in cmd/taskfused:taskfused examples/worker:taskfused-worker examples/demo:taskfused-demo; do
            go build -trimpath -tags sqlite_omit_load_extension -ldflags '-s -w' -o "pkg/${p#*:}.exe" "./${p%:*}"
          done
          file pkg/*
      - name: Package
        run: |
          cp LICENSE NOTICE THIRD_PARTY_LICENSES.md README.md pkg/
          (cd pkg && zip -q ../taskfused_windows_amd64.zip *)
      - uses: actions/upload-artifact@v7
        with:
          name: taskfused_windows_amd64
          path: taskfused_windows_amd64.zip

  windows-check:
    needs: [plan, windows]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - uses: actions/download-artifact@v8
        with:
          name: taskfused_windows_amd64
      - name: Run the Windows binaries
        shell: pwsh
        run: |
          Expand-Archive taskfused_windows_amd64.zip -DestinationPath bin
          python scripts/smoke.py bin
          if ($LASTEXITCODE -ne 0) { throw "smoke check failed" }

  release:
    needs: [plan, linux, macos, windows, windows-check]
    # Two runs for the same tag take turns; the second finds it published.
    concurrency:
      group: release-${{ needs.plan.outputs.tag }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      REF: ${{ needs.plan.outputs.ref }}
      NEW: ${{ needs.plan.outputs.new }}
      GH_TOKEN: ${{ github.token }}
      FILES: >-
        taskfused_linux_amd64.tar.gz taskfused_linux_arm64.tar.gz
        taskfused_darwin_arm64.tar.gz taskfused_darwin_amd64.tar.gz
        taskfused_windows_amd64.zip SHA256SUMS
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: taskfused_*
          path: dist
          merge-multiple: true
      - name: Checksums and notes
        run: |
          cd dist
          sha256sum taskfused_* > SHA256SUMS
          cat SHA256SUMS
          cat > ../notes.md <<'EOF'
          Ready-built TaskFused binaries. Each archive holds three commands with the license files and README:

          - `taskfused`: submit, inspect, wait for, cancel and retry operations, set limits, prune results, and `serve` the loopback HTTP API and status page
          - `taskfused-worker`: the example worker with its built-in echo handler
          - `taskfused-demo`: the self-checking demo, which kills a real worker process and recovers it (`taskfused-demo -http`)

          | System | File |
          |---|---|
          | Linux, x86-64 (static) | taskfused_linux_amd64.tar.gz |
          | Linux, ARM64 (static) | taskfused_linux_arm64.tar.gz |
          | macOS, Apple silicon | taskfused_darwin_arm64.tar.gz |
          | macOS, Intel | taskfused_darwin_amd64.tar.gz |
          | Windows, x86-64 | taskfused_windows_amd64.zip |

          SHA256SUMS lists the checksums. The macOS binaries aren't signed by Apple, so macOS may ask you to allow them the first time, or you can run `xattr -d com.apple.quarantine taskfused taskfused-worker taskfused-demo`. To use TaskFused from Go instead: `go get github.com/taskfused/taskfused@latest`.
          EOF
      - name: Tag the commit and publish the release, binaries attached
        if: env.NEW == 'true'
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "$TAG is out already."
            exit 0
          fi
          cd dist
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$REF" \
            --title "TaskFused $TAG" --notes-file ../notes.md $FILES
      - name: Attach the binaries to an existing release
        if: env.NEW != 'true'
        run: |
          cd dist
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber $FILES
          body=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
          if [ -z "$body" ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file ../notes.md
          fi
